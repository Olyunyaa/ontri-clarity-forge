<style>
:root{
  --navy:#111B32; --bg:#F6F4EE; --card:#FFFFFF; --beige:#E2C9A0; --gold:#B08A3E;
  --muted:#5A5F6A; --line:rgba(17,27,50,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--navy);font-family:Inter,sans-serif;font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:32px 20px 64px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
.brand{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22px;color:var(--navy);text-decoration:none}
.lang button{background:none;border:none;font:inherit;font-size:13px;letter-spacing:.08em;color:var(--muted);cursor:pointer;padding:4px 6px}
.lang button.active{color:var(--navy);font-weight:600}
.progress{height:2px;background:var(--line);border-radius:2px;margin-bottom:36px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s ease}
.screen{display:none;animation:fade .35s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.badge{display:inline-block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:16px}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(30px,5vw,42px);line-height:1.15;margin-bottom:14px}
h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(24px,4vw,30px);line-height:1.2;margin-bottom:8px}
.sub{color:var(--muted);font-weight:300;font-size:16px;max-width:520px;margin-bottom:28px}
.qnum{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.hint{font-size:13px;color:var(--muted);margin:2px 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:12px 18px;font:inherit;font-size:15px;cursor:pointer;transition:all .15s ease;color:var(--navy);text-align:left}
.chip:hover{border-color:var(--gold)}
.chip.sel{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.btn{display:inline-block;background:var(--navy);color:var(--bg);border:none;border-radius:3px;padding:14px 28px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn[disabled]{opacity:.4;cursor:default}
.back{background:none;border:none;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;padding:0;margin-top:24px;display:inline-block}
.back:hover{color:var(--navy)}
.note{font-size:12px;color:var(--muted);margin-top:18px}
.time-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.time-row input{width:110px;border:1px solid var(--line);border-radius:3px;padding:12px 14px;font:inherit;font-size:15px;background:var(--card);color:var(--navy)}
.time-row input:focus{outline:none;border-color:var(--gold)}
.verdict{display:inline-block;background:var(--navy);color:var(--beige);border-radius:3px;padding:6px 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:14px}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:24px 28px;margin-bottom:16px}
.result-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px}
.result-card p{color:var(--muted);font-size:15px}
.numbers{border-left:2px solid var(--beige);padding-left:14px;font-size:15px;color:var(--navy);font-weight:500}
.case-card{background:var(--navy);color:var(--bg);border-radius:3px;padding:24px 28px;margin-bottom:16px}
.case-card .result-label{color:var(--beige)}
.case-card .role{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,244,238,.65);margin-bottom:6px}
.case-card .line{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;line-height:1.3;margin-bottom:10px}
.case-card a{color:var(--beige);font-size:14px;text-decoration:none}
.case-card a:hover{text-decoration:underline}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 8px}
.email-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.email-row input{flex:1 1 220px;border:1px solid var(--line);border-radius:3px;padding:12px 14px;font:inherit;font-size:14px;background:var(--card);color:var(--navy)}
.email-row input:focus{outline:none;border-color:var(--gold)}
.sent-ok{color:var(--gold);font-size:14px;margin-top:10px;display:none}
@media (prefers-reduced-motion: reduce){.screen{animation:none}.progress i{transition:none}}
</style>
</head>

  document.querySelectorAll('[data-k]').forEach(el=>{
    let v = t(el.dataset.k);
    if(el.dataset.n) v = v.replace('{n}', el.dataset.n);
    if(el.dataset.k==='w_title'){ el.innerHTML=''; v.split('\n').forEach((line,i)=>{ if(i)el.appendChild(document.createElement('br')); el.appendChild(document.createTextNode(line)); }); }
    else el.textContent = v;
  });
  document.querySelectorAll('[data-k-ph]').forEach(el=>{ el.placeholder = t(el.dataset.kPh); });
  buildChips();
  if(document.getElementById('s-result').classList.contains('active')) renderResult();
}

function mkChips(cid, options, selected, onPick){
  const c = document.getElementById(cid); c.innerHTML='';
  options.forEach((label,i)=>{
    const b = document.createElement('button');
    b.className='chip'+(selected===i?' sel':''); b.textContent=label;
    b.onclick=()=>{ c.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); onPick(i); };
    c.appendChild(b);
  });
}

function buildChips(){
  mkChips('c-q1', TR[lang].q1, ans.q1, i=>{ if(ans.q1!==i) ans.q2=null; ans.q1=i; setTimeout(()=>{ buildChips(); go(2); },220); });
  if(ans.q1!==null) mkChips('c-q2', TR[lang].q2[ans.q1], ans.q2, i=>{ ans.q2=i; setTimeout(()=>go(3),220); });
  mkChips('c-q3', TR[lang].q3, ans.q3, i=>{ ans.q3=i; setTimeout(()=>go(4),220); });
  mkChips('c-q4', TR[lang].q4, ans.q4, i=>{ ans.q4=i; setTimeout(()=>go(5),220); });
  mkChips('c-unit', TR[lang].units, ans.tUnit, i=>{ ans.tUnit=i; ans.tNever=false; buildChips(); q5Check(); });
  mkChips('c-never', [TR[lang].never], ans.tNever?0:null, ()=>{ ans.tNever=!ans.tNever; if(ans.tNever){ ans.tNum=null; ans.tUnit=null; document.getElementById('t-num').value=''; } buildChips(); q5Check(); });
  mkChips('c-q6', TR[lang].q6, ans.q6, i=>{ ans.q6=i; setTimeout(()=>go(7),220); });
  mkChips('c-q7', TR[lang].q7, ans.q7, i=>{ ans.q7=i; setTimeout(()=>{ go(8); renderResult(); },220); });
  q5Check();
}

function q5Check(){
  const n = parseFloat(document.getElementById('t-num').value);
  if(!isNaN(n) && n>0) ans.tNum = n;
  document.getElementById('q5-next').disabled = !(ans.tNever || (ans.tNum>0 && ans.tUnit!==null));
}
document.getElementById('t-num').addEventListener('input', ()=>{ ans.tNever=false; buildChips(); });

function go(n){
  screens.forEach((id,i)=>document.getElementById(id).classList.toggle('active', i===n));
  document.getElementById('bar').style.width = (n===0?0:n===8?100:(n/8*100))+'%';
  window.scrollTo(0,0);
}

function hoursPerRun(){
  if(ans.tNever || !ans.tNum || ans.tUnit===null) return null;
  return ans.tUnit===0 ? ans.tNum/60 : ans.tNum;
}
function annualHours(){
  const h = hoursPerRun(), runs = TR[lang].runsYear[ans.q4];
  if(h===null || runs===null) return null;
  return Math.round(h*runs);
}
function ruPlural(n, one, few, many){
  const m10 = n%10, m100 = n%100;
  if(m10===1 && m100!==11) return one;
  if(m10>=2 && m10<=4 && (m100<12 || m100>14)) return few;
  return many;
}
function hoursWord(n){
  if(lang==='ru') return ruPlural(Math.round(n),'час','часа','часов');
  return n===1 ? 'hour' : 'hours';
}
function minutesWord(n){
  if(lang==='ru') return ruPlural(Math.round(n),'минута','минуты','минут');
  return n===1 ? 'minute' : 'minutes';
}
function timeStr(){
  if(ans.tNever||!ans.tNum) return '';
  return ans.tNum + ' ' + (ans.tUnit===0 ? minutesWord(ans.tNum) : hoursWord(ans.tNum));
}

function verdictKey(){
  const humanCore = ans.q1===5 && ans.q2===4;
  const vague = ans.q1===6 && ans.q2===4;
  const annual = annualHours();
  if(humanCore) return 'edges';
  if(ans.q3>=2 || ans.q6>=2 || vague) return 'standardise';
  if(annual===null) return 'measure';
  if(ans.q7===5) return 'notneeded';
  if(annual<40) return 'notworth';
  return 'automate';
}

function genResult(){
  const key = verdictKey();
  const annual = annualHours();
  const en = lang==='en';
  const task = TR[lang].q2[ans.q1] ? TR[lang].q2[ans.q1][ans.q2] : '';
  const numbersLine = annual!==null
    ? (en ? `${timeStr()} per run × ${TR[lang].runsLabel[ans.q4]} ≈ ${annual} ${hoursWord(annual)} of team time a year.`
          : `${timeStr()} на прогон × ${TR[lang].runsLabel[ans.q4]} ≈ ${annual} ${ruPlural(annual,'час','часа','часов')} командного времени в год.`)
    : null;
  const R = {key, label:VERDICTS[lang][key].label, headline:VERDICTS[lang][key].headline, numbers:null, why:'', first:'', boundary:''};

  if(key==='automate'){
    R.numbers = numbersLine;
    R.why = en
      ? `"${task}" can mostly be done from written instructions and stays close to identical run after run. Repeatable, documented work at this volume is exactly where automation pays off.`
      : `«${task}» в основном делается по письменной инструкции и почти не меняется от раза к разу. Повторяемая, описанная работа в таком объёме это ровно то место, где автоматизация окупается.`;
    R.first = en
      ? 'Pick the narrowest step inside it and pilot only that, with a human reviewing every output. Two weeks is enough to know whether it holds.'
      : 'Выберите самый узкий шаг внутри задачи и запустите пилот только на него, с проверкой каждого результата человеком. Двух недель хватит, чтобы понять.';
    R.boundary = en
      ? 'Keep the final check with a human until the pilot earns trust. Automate the work, not the responsibility.'
      : 'Финальную проверку оставьте человеку, пока пилот не заслужит доверие. Автоматизируется работа, а не ответственность.';
  }
  if(key==='edges'){
    R.why = en
      ? 'Relationships and live judgement are the part of the work where a human is the value. Automating the conversation itself would cost more than it saves, in trust.'
      : 'Отношения и живое суждение это та часть работы, где человек и есть ценность. Автоматизация самого разговора обойдётся дороже, чем сэкономит, причём в доверии.';
    R.first = en
      ? 'Re-run this check for one task around the conversations: preparation, meeting capture, follow-ups or CRM updates. Those are often excellent candidates.'
      : 'Пройдите чек ещё раз для задачи вокруг разговоров: подготовка, фиксация встречи, фоллоу-апы, обновление CRM. Это часто отличные кандидаты.';
    R.boundary = en
      ? 'The rule: automate what surrounds the relationship, never the relationship.'
      : 'Правило простое: автоматизируйте то, что окружает отношения, но не сами отношения.';
  }
  if(key==='standardise'){
    const parts = [];
    if(ans.q3>=2) parts.push(en
      ? 'if a competent person cannot do it from written instructions, an AI cannot either: the process lives in someone\'s head'
      : 'если толковый человек не сделает её по письменной инструкции, не сделает и AI: процесс живёт у кого-то в голове');
    if(ans.q6>=2) parts.push(en
      ? 'when exceptions are the rule, automation breaks on every second run'
      : 'когда исключения это норма, автоматизация ломается на каждом втором прогоне');
    if(ans.q1===6 && ans.q2===4) parts.push(en
      ? 'if the task is hard to name, it is not yet one process but several tangled together'
      : 'если задачу сложно назвать, это пока не один процесс, а несколько спутанных');
    R.why = (en?'Right now ':'Пока что ') + parts.join(en?', and ':', и ') + '.';
    R.numbers = annual!==null ? (en
      ? `At stake: ${numbersLine} Worth fixing even before any AI.`
      : `На кону: ${numbersLine} Это стоит починить ещё до всякого AI.`) : null;
    R.first = en
      ? 'Write the steps down once, have someone else run the task twice from your notes, and log every exception. Two weeks later you will know exactly which parts are automatable.'
      : 'Запишите шаги один раз, попросите другого человека дважды пройти задачу по вашим заметкам и фиксируйте каждое исключение. Через две недели будет ясно, какие части автоматизируемы.';
    R.boundary = en
      ? 'Come back to this check once instructions exist. The verdict will likely change.'
      : 'Вернитесь к чеку, когда инструкция появится. Вердикт, скорее всего, изменится.';
  }
  if(key==='measure'){
    R.why = en
      ? 'You have not measured how much time this takes, and an honest assessment refuses to invent the number. Most people misestimate routine work by two to three times.'
      : 'Вы не замеряли, сколько времени это занимает, а честная оценка отказывается выдумывать цифру. Рутину обычно недооценивают или переоценивают в два-три раза.';
    R.first = en
      ? 'Run a two-week log: date, minutes spent, who was involved, what went wrong. One line per run is enough.'
      : 'Заведите лог на две недели: дата, потраченные минуты, кто участвовал, что пошло не так. Одной строки на прогон достаточно.';
    R.boundary = en
      ? 'With that log this check gives you a real verdict. And never buy automation priced on unmeasured pain.'
      : 'С этим логом чек даст настоящий вердикт. И никогда не покупайте автоматизацию, оценённую на незамеренной боли.';
  }
  if(key==='notworth'){
    R.numbers = numbersLine;
    R.why = en
      ? 'Building and maintaining automation would likely cost more than these hours are worth. That is a fine outcome: not every task deserves a robot.'
      : 'Построить и поддерживать автоматизацию, скорее всего, дороже, чем стоят эти часы. И это нормальный результат: не каждая задача заслуживает робота.';
    R.first = en
      ? 'Revisit when the volume doubles, when errors start costing money, or when the person doing it leaves.'
      : 'Вернитесь к вопросу, когда объём удвоится, ошибки начнут стоить денег или уйдёт человек, который это делает.';
    R.boundary = en
      ? 'What would change the answer: more volume, higher stakes, or the task blocking someone expensive.'
      : 'Что изменило бы ответ: больший объём, выше цена ошибки или то, что задача блокирует дорогого человека.';
  }
  if(key==='notneeded'){
    R.numbers = numbersLine;
    R.why = en
      ? 'You could not name what would improve if this took less time. Before automating anything, ask whether the task needs to exist: deleting a task beats automating it every time.'
      : 'Вы не смогли назвать, что улучшится, если задача станет быстрее. Прежде чем автоматизировать, спросите, нужна ли она вообще: удалить задачу всегда лучше, чем автоматизировать её.';
    R.first = en
      ? 'Try skipping one run and see who notices. If nobody does, you have your answer.'
      : 'Пропустите один прогон и посмотрите, кто заметит. Если никто, вот и ответ.';
    R.boundary = en
      ? 'If someone does notice, come back: now you know the real consumer of this work, and the check will read differently.'
      : 'Если кто-то заметит, возвращайтесь: теперь известен настоящий потребитель этой работы, и чек прочитается иначе.';
  }
  return R;
}

function renderResult(){
  const R = genResult();
  document.getElementById('r-verdict').textContent = R.label;
  document.getElementById('r-title').textContent = R.headline;
  document.getElementById('r-numbers-card').style.display = R.numbers ? 'block' : 'none';
  if(R.numbers) document.getElementById('r-numbers').textContent = R.numbers;
  document.getElementById('r-why').textContent = R.why;
  document.getElementById('r-first').textContent = R.first;
  document.getElementById('r-boundary').textContent = R.boundary;
  const cs = CASES[lang][ans.q1 ?? 0];
  document.getElementById('r-case-role').textContent = cs.role;
  document.getElementById('r-case-line').textContent = cs.line;
  sendAnalytics();
}

function restart(){
  ans = {q1:null,q2:null,q3:null,q4:null,tNum:null,tUnit:null,tNever:false,q6:null,q7:null};
  analyticsSent = false;
  document.getElementById('t-num').value='';
  buildChips(); go(0);
  document.getElementById('sent-ok').style.display='none';
  document.getElementById('lead-email').value='';
}

let analyticsSent = false;
const EJS_SERVICE = 'service_pfl7vyt', EJS_KEY = 'MqADpxGb2aRhHIjN2';
const EJS_TEMPLATE_CHECK = 'template_ilm44bu', EJS_TEMPLATE_LEGACY = 'template_xo7wv5f';

function answersSummary(){
  return [
    TR[lang].q1_t+' '+(ans.q1!==null?TR[lang].q1[ans.q1]:'-'),
    TR[lang].q2_t+' '+(ans.q2!==null?TR[lang].q2[ans.q1][ans.q2]:'-'),
    TR[lang].q3_t+' '+(ans.q3!==null?TR[lang].q3[ans.q3]:'-'),
    TR[lang].q4_t+' '+(ans.q4!==null?TR[lang].q4[ans.q4]:'-'),
    TR[lang].q5_t+' '+(ans.tNever?TR[lang].never:timeStr()),
    TR[lang].q6_t+' '+(ans.q6!==null?TR[lang].q6[ans.q6]:'-'),
    TR[lang].q7_t+' '+(ans.q7!==null?TR[lang].q7[ans.q7]:'-')
  ].join(' | ');
}

function resultBodyHtml(){
  const R = genResult();
  return '<b>' + R.label + ': ' + R.headline + '</b><br><br>' +
    (R.numbers ? '<b>Numbers:</b> ' + R.numbers + '<br>' : '') +
    '<b>Why:</b> ' + R.why + '<br><b>First step:</b> ' + R.first + '<br><b>Boundary:</b> ' + R.boundary +
    '<br><br><b>All answers:</b> ' + answersSummary();
}

function sendToOlya(kind, email){
  const R = genResult();
  const isLead = kind === 'lead';
  const checkParams = {
    subject: (isLead ? 'New lead · ' : 'Completed · ') + 'AI Automation Check',
    kind_label: isLead ? 'New lead' : 'Completed, no email left',
    lead_email: email || '-',
    role: R.label,
    business: (ans.q1!==null?TR[lang].q1[ans.q1]:'-') + ' · ' + (ans.q2!==null?TR[lang].q2[ans.q1][ans.q2]:'-'),
    team: (ans.q4!==null?TR[lang].q4[ans.q4]:'-') + ', ' + (ans.tNever?TR[lang].never:timeStr()),
    pains: (ans.q3!==null?TR[lang].q3_t+' '+TR[lang].q3[ans.q3]:'') + ' | ' + (ans.q6!==null?TR[lang].q6[ans.q6]:''),
    ai_exp: ans.q7!==null?TR[lang].q7[ans.q7]:'-',
    result_title: R.label + ': ' + R.headline,
    result_body: resultBodyHtml(),
    lang: lang
  };
  const legacyParams = {
    lang: lang,
    name: 'AI Automation Check ' + (isLead ? 'lead: ' + email : '(no email left)'),
    role: R.label,
    company: checkParams.business,
    phone: email || '-',
    goal: R.headline,
    problems: answersSummary(),
    routine_total:'-', routine_ai:'-', routine_goal:'-',
    tasks_html: resultBodyHtml()
  };
  return emailjs.send(EJS_SERVICE, EJS_TEMPLATE_CHECK, checkParams, EJS_KEY)
    .catch(() => emailjs.send(EJS_SERVICE, EJS_TEMPLATE_LEGACY, legacyParams, EJS_KEY));
}

function sendAnalytics(){
  if(analyticsSent || typeof emailjs === 'undefined') return;
  analyticsSent = true;
  try{ sendToOlya('completed').catch(()=>{}); }catch(e){}
}

function sendResult(){
  const email = document.getElementById('lead-email').value.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)) { document.getElementById('lead-email').focus(); return; }
  const btn = document.getElementById('send-btn');
  const fail = () => {
    btn.disabled = false; btn.textContent = t('r_email_btn');
    alert(lang==='ru' ? 'Не получилось отправить. Попробуйте ещё раз.' : 'Could not send. Please try again.');
  };
  btn.disabled = true;
  btn.textContent = lang==='ru' ? 'Отправляю...' : 'Sending...';
  try{
    sendToOlya('lead', email)
      .then(()=>{ btn.textContent = t('r_email_btn'); document.getElementById('sent-ok').style.display='block'; })
      .catch(fail);
  }catch(e){ fail(); }
}
document.getElementById('lead-email').addEventListener('keydown', e => { if(e.key==='Enter') sendResult(); });

setLang(lang);
go(0);
</script>
