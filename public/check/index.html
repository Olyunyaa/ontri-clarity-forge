<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Opportunity Check | Ontrí Advisory</title>
<meta name="description" content="Five quick questions. See the most likely place AI pays off in your business, in under three minutes.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#111B32; --bg:#F6F4EE; --card:#FFFFFF; --beige:#E2C9A0; --gold:#B08A3E;
  --muted:#5A5F6A; --line:rgba(17,27,50,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--navy);font-family:Inter,sans-serif;font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:32px 20px 64px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
.brand{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22px;color:var(--navy);text-decoration:none}
.lang button{background:none;border:none;font:inherit;font-size:13px;letter-spacing:.08em;color:var(--muted);cursor:pointer;padding:4px 6px}
.lang button.active{color:var(--navy);font-weight:600}
.progress{height:2px;background:var(--line);border-radius:2px;margin-bottom:36px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s ease}
.screen{display:none;animation:fade .35s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.badge{display:inline-block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:16px}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(30px,5vw,42px);line-height:1.15;margin-bottom:14px}
h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(24px,4vw,30px);line-height:1.2;margin-bottom:8px}
.sub{color:var(--muted);font-weight:300;font-size:16px;max-width:520px;margin-bottom:28px}
.qnum{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.hint{font-size:13px;color:var(--muted);margin:2px 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:12px 18px;font:inherit;font-size:15px;cursor:pointer;transition:all .15s ease;color:var(--navy)}
.chip:hover{border-color:var(--gold)}
.chip.sel{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.btn{display:inline-block;background:var(--navy);color:var(--bg);border:none;border-radius:3px;padding:14px 28px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn[disabled]{opacity:.4;cursor:default}
.back{background:none;border:none;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;padding:0;margin-top:24px;display:inline-block}
.back:hover{color:var(--navy)}
.note{font-size:12px;color:var(--muted);margin-top:18px}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:28px;margin-bottom:16px}
.result-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px}
.result-card p{color:var(--muted);font-size:15px}
.result-card p strong{color:var(--navy);font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.meta{flex:1 1 200px;border-left:2px solid var(--beige);padding-left:12px}
.meta .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meta .v{font-size:14px;font-weight:500;color:var(--navy)}
.case-card{background:var(--navy);color:var(--bg);border-radius:3px;padding:24px 28px;margin-bottom:16px}
.case-card .result-label{color:var(--beige)}
.case-card .role{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,244,238,.65);margin-bottom:6px}
.case-card .line{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;line-height:1.3;margin-bottom:10px}
.case-card a{color:var(--beige);font-size:14px;text-decoration:none}
.case-card a:hover{text-decoration:underline}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 8px}
.email-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.email-row input{flex:1 1 220px;border:1px solid var(--line);border-radius:3px;padding:12px 14px;font:inherit;font-size:14px;background:var(--card);color:var(--navy)}
.email-row input:focus{outline:none;border-color:var(--gold)}
.sent-ok{color:var(--gold);font-size:14px;margin-top:10px;display:none}
@media (prefers-reduced-motion: reduce){.screen{animation:none}.progress i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/">Ontrí Advisory</a>
    <div class="lang">
      <button id="lb-en" onclick="setLang('en')">EN</button><span style="color:var(--line)">/</span><button id="lb-ru" onclick="setLang('ru')">RU</button>

  <div class="progress"><i id="bar"></i></div>

  <div class="screen active" id="s-welcome">

    <p class="note" data-k="w_note"></p>
  </div>

  <div class="screen" id="s-q1">

    <button class="back" onclick="go(0)" data-k="back"></button>
  </div>

  <div class="screen" id="s-q2">

      <br><button class="btn" style="margin-top:14px" onclick="go(3)" data-k="next"></button>

  <div class="screen" id="s-q3">

    <button class="back" onclick="go(2)" data-k="back"></button>
  </div>

  <div class="screen" id="s-q4">

    <h2 data-k="q4_t"></h2>
    <p class="hint" data-k="q4_hint"></p>
    <div class="chips" id="c-q4"></div>
    <button class="btn" id="q4-next" disabled onclick="go(5)" data-k="next"></button>
    <br><button class="back" onclick="go(3)" data-k="back"></button>
  </div>

  <div class="screen" id="s-q5">
    <p class="qnum" data-k="q_of" data-n="5"></p>
    <h2 data-k="q5_t"></h2>
    <div class="chips" id="c-q5"></div>
    <button class="back" onclick="go(4)" data-k="back"></button>
  </div>

  <div class="screen" id="s-a1">
    <p class="qnum" data-k="q_of" data-n="6"></p>
    <h2 id="a1-title"></h2>
    <div class="chips" id="c-a1"></div>
    <button class="back" onclick="go(5)" data-k="back"></button>
  </div>

  <div class="screen" id="s-a2">
    <p class="qnum" data-k="q_of" data-n="7"></p>
    <h2 id="a2-title"></h2>
    <div class="chips" id="c-a2"></div>
    <button class="back" onclick="go(6)" data-k="back"></button>
  </div>

  <div class="screen" id="s-a3">
    <p class="qnum" data-k="q_of" data-n="8"></p>
    <h2 id="a3-title"></h2>
    <div class="chips" id="c-a3"></div>
    <button class="back" onclick="go(7)" data-k="back"></button>
  </div>

  <div class="screen" id="s-result">
    <span class="badge" data-k="r_badge"></span>
    <h2 id="r-title" style="margin-bottom:20px"></h2>
    <div class="result-card">
      <div class="result-label" data-k="r_why"></div>
      <p id="r-why"></p>
    </div>
    <div class="result-card">
      <div class="result-label" data-k="r_pilot"></div>
      <p id="r-pilot"></p>
      <div class="meta-row">
        <div class="meta"><div class="k" data-k="r_value"></div><div class="v" id="r-value" style="font-weight:400"></div></div>
      </div>
    </div>
    <div class="result-card">
      <div class="result-label" data-k="r_needs"></div>
      <p id="r-needs" style="margin-bottom:14px"></p>
      <div class="result-label" data-k="r_notyet"></div>
      <p id="r-notyet"></p>
    </div>
    <div class="result-card">
      <div class="result-label" data-k="r_validate"></div>
      <p id="r-validate" style="color:var(--navy);font-weight:500"></p>
      <p id="r-exp" style="margin-top:10px"></p>
    </div>
    <div class="result-card" id="r-second-card" style="display:none">
      <div class="result-label" data-k="r_second"></div>
      <p id="r-second" style="color:var(--navy);font-weight:500"></p>
    </div>
    <div class="case-card">
      <div class="result-label" data-k="r_case"></div>
      <div class="role" id="r-case-role"></div>
      <div class="line" id="r-case-line"></div>
      <a href="/#cases" data-k="r_case_link"></a>
    </div>
    <div class="cta-row">
      <a class="btn" href="https://calendly.com/ontri-advisory/new-meeting" target="_blank" rel="noopener noreferrer" data-k="r_cta"></a>
      <button class="btn ghost" onclick="restart()" data-k="r_again"></button>
    </div>
    <p class="sub" style="margin:22px 0 0;font-size:14px" data-k="r_email_intro"></p>
    <div class="email-row">
      <input id="lead-email" type="email" data-k-ph="r_email_ph">
      <button class="btn ghost" id="send-btn" onclick="sendResult()" data-k="r_email_btn"></button>
    </div>
    <p class="sent-ok" id="sent-ok" data-k="r_email_ok"></p>
  </div>
</div>

    headline:'Узкое место это поиск: знания существуют, но их нахождение не масштабируется',
    why:`Знания живут ${lives}, уже отвеченные вопросы возвращаются ${often}, а когда ничего не находится, ${cost}. Это проблема поиска, а не документации.`,
    pilot:'Пилот RAG-ассистента на одном самом нагруженном срезе документации: отвечает мгновенно, ссылается на исходный документ, нестандартное передаёт человеку.',
    value:`${a[1]===0?'Ежедневные повторные вопросы в масштабе команды':a[1]===1?'Еженедельные повторные вопросы в масштабе команды':'Даже нечастые повторные вопросы'} обычно складываются в часы каждую неделю, плюс скрытая цена того, что ${cost}.`,
    needs:'Документы должны быть читабельны и более-менее актуальны. Качество важнее объёма: одна хорошая папка лучше трёх устаревших вики.',
    notYet:'Мы не стали бы автоматизировать ответы на чувствительные темы и вопросы, требующие суждения. Они по дизайну уходят человеку.',
    validate:'Возьмите пять самых повторяющихся вопросов и проверьте, есть ли на каждый актуальный письменный ответ. Это покажет, в поиске проблема или в документации.'};},
  (a)=>{ const meet=[7,17,37,60][a[0]], slips=['фоллоу-апы','дедлайны','подготовка к встречам','ничего заметного, но ценой вечеров'][a[1]],
    lives=['в одном трекере','в нескольких инструментах','в календаре и почте','в памяти'][a[2]];
    return {
    headline:'Узкое место в том, что координация держится на одном человеке, а не на системе',
    why:`Неделя из примерно ${meet} встреч и договорённостей, где чаще всего срываются ${slips}, а всё учитывается ${lives}, делает координатора единой точкой отказа.`,
    pilot:'Пилот личного операционного ассистента: ведёт задачи и договорённости, следит за дедлайнами, готовит фоллоу-апы и брифы перед встречами. Сначала один человек, потом команда.',
    value:`Даже 10 минут администрирования вокруг каждой из ${meet} недельных договорённостей это около ${Math.max(1,Math.round(meet*10/60))} часов чистой координации в неделю.`,
    needs:'У договорённостей должно быть одно место посадки, а у ассистента доступ к календарю и списку задач. Привычки здесь важнее инструментов.',
    notYet:'Мы не стали бы автоматизировать приоритизацию и умение говорить «нет». Ассистент подсвечивает, решаете вы.',
    validate:'Посчитайте, сколько договорённостей этой недели существует только в чьей-то голове или почте. Это число и есть риск, который вы несёте.'};},
  (a)=>{ const pieces=[2,10,30,60][a[0]], takes=['рисёрч перед написанием','первый черновик','редактура под свой голос','дистрибуция и переупаковка'][a[1]],
    voice=['задокументированный tone of voice, на котором можно учить сразу','ваши публикации как обучающий материал','частично описанный голос, который пилот дооформит','голоса пока нет, и пилот заставит его появиться'][a[2]];
    return {
    headline:`Узкое место это ${takes}, а не написание вообще`,
    why:`При примерно ${pieces} единицах контента в месяц, где больше всего времени съедает ${takes}, и учитывая, что есть ${voice}, решение это процесс под ваш голос, а не универсальный писательский инструмент.`,
    pilot:`Пилот контент-процесса для одного самого частого формата: сначала автоматизируем ${takes}, голос учим на ваших лучших публикациях, шаг человеческой проверки встроен.`,
    value:`Экономия даже 2 часов на единицу это около ${pieces*2} часов в месяц на вашем объёме.`,
    needs:'Корпус публикаций, которые вы считаете своим голосом, и ясность, какой один формат болит сильнее всего.',
    notYet:'Мы не стали бы автоматизировать финальное редакторское суждение и публикацию. Ничего не выходит без ваших глаз.',
    validate:'Возьмите последние пять единиц контента и отметьте, куда реально ушли часы. Самая большая строка и есть объём пилота.'};}
]
};

let lang = localStorage.getItem('oc_lang') || 'en';
let ans = {q1:null,q2:null,q3:null,q4:[],q5:null,a:[null,null,null]};
const screens = ['s-welcome','s-q1','s-q2','s-q3','s-q4','s-q5','s-a1','s-a2','s-a3','s-result'];

function t(k){ return TR[lang][k]; }

function setLang(l){
  lang = l; localStorage.setItem('oc_lang', l);
  document.documentElement.lang = l;
  document.getElementById('lb-en').classList.toggle('active', l==='en');
  document.getElementById('lb-ru').classList.toggle('active', l==='ru');
  document.querySelectorAll('[data-k]').forEach(el=>{
    let v = t(el.dataset.k);
    if(el.dataset.n) v = v.replace('{n}', el.dataset.n);
    if(el.dataset.k==='w_title'){ el.innerHTML=''; v.split('\n').forEach((line,i)=>{ if(i)el.appendChild(document.createElement('br')); el.appendChild(document.createTextNode(line)); }); }
    else el.textContent = v;
  });
  document.querySelectorAll('[data-k-ph]').forEach(el=>{ el.placeholder = t(el.dataset.kPh); });
  buildChips();
  if(document.getElementById('s-result').classList.contains('active')) renderResult();
}

function buildChips(){
  [['c-q1','q1',1],['c-q2','q2',1],['c-q3','q3',1],['c-q5','q5',1]].forEach(([cid,key])=>{
    const c = document.getElementById(cid); c.innerHTML='';
    TR[lang][key].forEach((label,i)=>{
      const b = document.createElement('button');
      b.className='chip'+(ans[key]===i?' sel':''); b.textContent=label;
      b.onclick=()=>{ ans[key]=i; c.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
        if(key==='q2'){
          const isOther = i === TR[lang].q2.length-1;
          document.getElementById('q2-other').style.display = isOther ? 'block' : 'none';
          if(isOther){ document.getElementById('q2-other-input').focus(); return; }
        }
        setTimeout(()=>{ const step = parseInt(key[1]); if(step===5){ buildAdaptive(); go(6); } else { go(step+1); } }, 220); };
      c.appendChild(b);
    });
  });
  document.getElementById('q2-other').style.display =
    (ans.q2 === TR[lang].q2.length-1) ? 'block' : 'none';
  if(ans.q4.length) buildAdaptive();
  const c4 = document.getElementById('c-q4'); c4.innerHTML='';
  TR[lang].q4.forEach((label,i)=>{
    const b = document.createElement('button');
    b.className='chip'+(ans.q4.includes(i)?' sel':''); b.textContent=label;
    b.onclick=()=>{
      if(ans.q4.includes(i)) ans.q4 = ans.q4.filter(x=>x!==i);
      else if(ans.q4.length<2) ans.q4.push(i);
      b.classList.toggle('sel', ans.q4.includes(i));
      document.getElementById('q4-next').disabled = ans.q4.length===0;
    };
    c4.appendChild(b);
  });
  document.getElementById('q4-next').disabled = ans.q4.length===0;
}

function go(n){
  screens.forEach((id,i)=>document.getElementById(id).classList.toggle('active', i===n));
  document.getElementById('bar').style.width = (n===0?0:n===9?100:(n/9*100))+'%';
  window.scrollTo(0,0);
}

function buildAdaptive(){
  const pain = ans.q4[0];
  if(pain === undefined) return;
  [0,1,2].forEach(k=>{
    document.getElementById('a'+(k+1)+'-title').textContent = ADAPT[lang][pain].q[k].t;
    const c = document.getElementById('c-a'+(k+1)); c.innerHTML='';
    ADAPT[lang][pain].q[k].o.forEach((label,i)=>{
      const b = document.createElement('button');
      b.className='chip'+(ans.a[k]===i?' sel':''); b.textContent=label;
      b.onclick=()=>{ ans.a[k]=i; c.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
        setTimeout(()=>{ if(k===2){ go(9); renderResult(); } else { go(7+k); } }, 220); };
      c.appendChild(b);
    });
  });
}

function renderResult(){
  const pain = ans.q4[0];
  const primary = OPS[lang][pain];
  const a = ans.a.map(x => x ?? 0);
  const gen = RESGEN[lang][pain](a);
  document.getElementById('r-title').textContent = gen.headline;
  document.getElementById('r-why').textContent = gen.why;
  document.getElementById('r-pilot').textContent = gen.pilot;
  document.getElementById('r-value').textContent = gen.value;
  document.getElementById('r-needs').textContent = gen.needs;
  document.getElementById('r-notyet').textContent = gen.notYet;
  document.getElementById('r-validate').textContent = gen.validate;
  document.getElementById('r-exp').textContent = TR[lang].exp[ans.q5 ?? 0];
  const second = ans.q4[1] !== undefined ? OPS[lang][ans.q4[1]] : null;
  document.getElementById('r-second-card').style.display = second ? 'block' : 'none';
  if(second) document.getElementById('r-second').textContent = second.t;
  document.getElementById('r-case-role').textContent = primary.caseRole;
  document.getElementById('r-case-line').textContent = primary.caseLine;
  sendAnalytics();
}

let analyticsSent = false;
const EJS_SERVICE = 'service_pfl7vyt', EJS_KEY = 'MqADpxGb2aRhHIjN2';
const EJS_TEMPLATE_CHECK = 'template_ilm44bu', EJS_TEMPLATE_LEGACY = 'template_xo7wv5f';

function q2Label(){
  const other = (document.getElementById('q2-other-input').value || '').trim();
  const isOther = ans.q2 === TR[lang].q2.length-1;
  return TR[lang].q2[ans.q2 ?? 0] + (isOther && other ? ' (' + other + ')' : '');
}

function adaptiveSummary(){
  const pain = ans.q4[0];
  if(pain === undefined) return '';
  return ADAPT[lang][pain].q.map((q,k)=> q.t + ' ' + (ans.a[k] !== null ? q.o[ans.a[k]] : '-')).join(' | ');
}

function resultBodyHtml(){
  const pain = ans.q4[0];
  const gen = RESGEN[lang][pain](ans.a.map(x => x ?? 0));
  return '<b>' + gen.headline + '</b><br><br>' + gen.why +
    '<br><br><b>Pilot:</b> ' + gen.pilot +
    '<br><b>Value:</b> ' + gen.value +
    '<br><b>Validate:</b> ' + gen.validate +
    '<br><br><b>Adaptive answers:</b> ' + adaptiveSummary();
}

function sendToOlya(kind, email){
  const primary = OPS[lang][ans.q4[0]];
  const isLead = kind === 'lead';
  const checkParams = {
    subject: (isLead ? 'New lead · ' : 'Completed · ') + 'AI Opportunity Check',
    kind_label: isLead ? 'New lead' : 'Completed, no email left',
    lead_email: email || '-',
    role: TR[lang].q1[ans.q1 ?? 5],
    business: q2Label(),
    team: TR[lang].q3[ans.q3 ?? 0],
    pains: ans.q4.map(i=>TR[lang].q4[i]).join(', '),
    ai_exp: TR[lang].q5[ans.q5 ?? 0],
    result_title: RESGEN[lang][ans.q4[0]](ans.a.map(x => x ?? 0)).headline,
    result_body: resultBodyHtml(),
    lang: lang
  };
  const legacyParams = {
    lang: lang,
    name: 'AI Opportunity Check ' + (isLead ? 'lead: ' + email : '(no email left)'),
    role: TR[lang].q1[ans.q1 ?? 5],
    company: q2Label() + ' · ' + TR[lang].q3[ans.q3 ?? 0],
    phone: email || '-',
    goal: primary.t,
    problems: ans.q4.map(i=>TR[lang].q4[i]).join(', ') + ' | AI: ' + TR[lang].q5[ans.q5 ?? 0],
    routine_total:'-', routine_ai:'-', routine_goal:'-',
    tasks_html: resultBodyHtml()
  };
  return emailjs.send(EJS_SERVICE, EJS_TEMPLATE_CHECK, checkParams, EJS_KEY)
    .catch(() => emailjs.send(EJS_SERVICE, EJS_TEMPLATE_LEGACY, legacyParams, EJS_KEY));
}

function sendAnalytics(){
  if(analyticsSent || typeof emailjs === 'undefined') return;
  analyticsSent = true;
  try{ sendToOlya('completed').catch(()=>{}); }catch(e){}
}

function restart(){
  ans = {q1:null,q2:null,q3:null,q4:[],q5:null,a:[null,null,null]};
  analyticsSent = false;
  document.getElementById('q2-other-input').value='';
  buildChips(); go(0);
  document.getElementById('sent-ok').style.display='none';
  document.getElementById('lead-email').value='';
}

function sendResult(){
  const email = document.getElementById('lead-email').value.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)) { document.getElementById('lead-email').focus(); return; }
  const btn = document.getElementById('send-btn');
  const fail = () => {
    btn.disabled = false; btn.textContent = t('r_email_btn');
    alert(lang==='ru' ? 'Не получилось отправить. Попробуйте ещё раз.' : 'Could not send. Please try again.');
  };
  btn.disabled = true;
  btn.textContent = lang==='ru' ? 'Отправляю...' : 'Sending...';
  try{
    sendToOlya('lead', email)
      .then(()=>{ btn.textContent = t('r_email_btn'); document.getElementById('sent-ok').style.display='block'; })
      .catch(fail);
  }catch(e){ fail(); }
}
document.getElementById('lead-email').addEventListener('keydown', e => { if(e.key==='Enter') sendResult(); });

setLang(lang);
go(0);
</script>
